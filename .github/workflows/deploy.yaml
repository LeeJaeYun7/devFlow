name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: 'deploy'
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::058264441782:role/GitHubAction
          aws-region: ap-northeast-2

      - name: Setup Node 22.13
        uses: actions/setup-node@v2
        with:
          node-version: 22.13.0

      - name: Install pnpm
        run: npm install -g pnpm@9.15

      - name: Install dependencies (pnpm i)
        run: pnpm i

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: ECR Login
        run: aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 058264441782.dkr.ecr.ap-northeast-2.amazonaws.com

      - name: Build and Push Docker Image (via Nx deploy target)
        run: pnpm dlx nx run-many --target=build,deploy --parallel --projects=backend  
        env:
          ECR_REPOSITORY_NAME: devflow
 
      - name: Fill in the new image ID in the ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .github/workflows/task-definition.json 
          container-name: devflow-backend-container 
          image: 058264441782.dkr.ecr.ap-northeast-2.amazonaws.com/devflow:${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: devflow-service 
          cluster: devflow-cluster
          wait-for-service-stability: true

      # --- Frontend Build & Deploy to S3 ---
      - name: Build frontend
        run: pnpm build --filter=frontend

      - name: Upload frontend to S3
        run: aws s3 sync ./dist s3://devflow-frontend --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1M5DEDTE5NQZX \
            --paths "/*"
